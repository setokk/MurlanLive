<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password</title>
  <style>
      @font-face {
          font-family: 'BarberChop';
          src: url('./fonts/BarberChop.otf') format('opentype');
          font-weight: 100 900;
          font-style: normal;
      }

      body {
          margin: 0;
          padding: 0;
          background-color: #0b0b0b;
          color: #ffffff;
          font-family: 'BarberChop', Arial, Helvetica, sans-serif;
          -webkit-font-smoothing: antialiased;
      }

      .page-wrapper {
          width: 100%;
          min-height: 100vh;
          background-color: #0b0b0b;
          padding: 40px 16px;
          box-sizing: border-box;
          display: flex;
          justify-content: center;
          align-items: center;
      }

      .container {
          width: 100%;
          max-width: 560px;
          background-color: #121212;
          border: 1px solid #292929;
          border-radius: 18px;
          overflow: hidden;
          box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      }

      .header {
          padding: 36px 32px 24px;
          text-align: center;
          background-color: #0f0f0f;
      }

      .logo {
          display: block;
          width: 180px;
          max-width: 70%;
          height: auto;
          margin: 0 auto;
          border: 0;
          outline: none;
      }

      .content {
          padding: 36px 40px 40px;
      }

      .title {
          margin: 0 0 18px;
          color: #ffffff;
          font-size: 28px;
          line-height: 1.25;
          font-weight: 700;
          text-align: center;
      }

      .accent-line {
          width: 50px;
          height: 4px;
          margin: 0 auto 28px;
          background-color: #e3262e;
          border-radius: 999px;
      }

      .text {
          margin: 0 0 18px;
          color: #c7c7c7;
          font-size: 15px;
          line-height: 1.7;
          text-align: center;
      }

      .form {
          margin-top: 30px;
      }

      .field {
          margin-bottom: 18px;
      }

      .label {
          display: block;
          margin-bottom: 8px;
          color: #b5b5b5;
          font-size: 14px;
          font-weight: 600;
      }

      .input {
          width: 100%;
          padding: 14px 18px;
          box-sizing: border-box;
          background-color: #191919;
          border: 1px solid #292929;
          border-radius: 999px;
          color: #ffffff;
          font-family: inherit;
          font-size: 15px;
          outline: none;
          transition: border-color 0.15s ease;
      }

      .input:focus {
          border-color: #e3262e;
      }

      .input::placeholder {
          color: #606060;
      }

      .error {
          display: none;
          margin: 8px 0 0;
          color: #e3262e;
          font-size: 13px;
      }

      .message {
          display: none;
          margin: 18px 0 0;
          padding: 14px 16px;
          background-color: #171717;
          border-radius: 10px;
          color: #b5b5b5;
          font-size: 13px;
          line-height: 1.6;
          text-align: center;
      }

      .button-container {
          margin: 30px 0 0;
          text-align: center;
      }

      .reset-button {
          padding: 15px 30px;
          border: 0;
          background-color: #e3262e;
          color: #ffffff;
          border-radius: 999px;
          font-family: inherit;
          font-size: 15px;
          font-weight: 700;
          line-height: 1;
          cursor: pointer;
          letter-spacing: 0.2px;
      }

      .reset-button:hover {
          background-color: #c91f27;
      }

      .reset-button:disabled {
          background-color: #6f171b;
          cursor: not-allowed;
      }

      .warning {
          margin-top: 28px;
          padding: 14px 16px;
          background-color: #171717;
          border-radius: 10px;
          color: #777777;
          font-size: 12px;
          line-height: 1.6;
          text-align: center;
      }

      .footer {
          padding: 22px 30px;
          border-top: 1px solid #292929;
          background-color: #0f0f0f;
          text-align: center;
      }

      .footer-text {
          margin: 0;
          color: #606060;
          font-size: 11px;
          line-height: 1.6;
      }

      @media only screen and (max-width: 600px) {
          .page-wrapper {
              padding: 20px 10px;
          }

          .content {
              padding: 30px 24px;
          }

          .header {
              padding: 28px 20px 20px;
          }

          .title {
              font-size: 24px;
          }

          .logo {
              width: 150px;
          }
      }
  </style>
</head>

<body>

<div class="page-wrapper">
  <div class="container">

    <div class="header">
      <img class="logo"
           src="./images/logo.png"
           alt="MuLive">
    </div>

    <div class="content">

      <h1 class="title">Reset Your Password</h1>

      <div class="accent-line"></div>

      <p class="text">
        Enter your new password below.
      </p>

      <form id="reset-form" class="form">

        <div class="field">
          <label class="label" for="password">
            New Password
          </label>

          <input
              class="input"
              type="password"
              id="password"
              name="password"
              placeholder="Enter your new password"
              autocomplete="new-password"
              required
          >
        </div>

        <div class="field">
          <label class="label" for="confirm-password">
            Confirm Password
          </label>

          <input
              class="input"
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Confirm your new password"
              autocomplete="new-password"
              required
          >

          <p id="password-error" class="error">
            Passwords do not match.
          </p>
        </div>

        <div class="button-container">
          <button
              id="reset-button"
              class="reset-button"
              type="submit"
          >
            Reset Password
          </button>
        </div>

        <div id="message" class="message"></div>

      </form>

      <div class="warning">
        If you did not request a password reset, you can safely
        close this page. Your password will remain unchanged.
      </div>

    </div>

    <div class="footer">
      <p class="footer-text">
        This is an automated password reset page from MuLive.
      </p>
    </div>

  </div>
</div>

<script>
    const form = document.getElementById("reset-form");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirm-password");
    const passwordError = document.getElementById("password-error");
    const resetButton = document.getElementById("reset-button");
    const message = document.getElementById("message");

    const token = new URLSearchParams(window.location.search).get("token");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // Never send the request if the passwords don't match.
        if (password !== confirmPassword) {
            passwordError.style.display = "block";
            message.style.display = "none";
            return;
        }

        passwordError.style.display = "none";

        if (!token) {
            message.textContent = "Invalid or missing reset token.";
            message.style.display = "block";
            return;
        }

        resetButton.disabled = true;
        resetButton.textContent = "Resetting...";

        try {
            const response = await fetch(
                "/api/players/reset-password",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: password
                    })
                }
            );

            if (response.ok) {
                message.textContent =
                    "Your password has been successfully reset.";
                message.style.display = "block";

                form.reset();
                resetButton.textContent = "Password Reset";
            } else {
                message.textContent =
                    "The reset link is invalid or has expired.";
                message.style.display = "block";

                resetButton.disabled = false;
                resetButton.textContent = "Reset Password";
            }

        } catch (error) {
            message.textContent =
                "Something went wrong. Please try again later.";
            message.style.display = "block";

            resetButton.disabled = false;
            resetButton.textContent = "Reset Password";
        }
    });
</script>

</body>
</html>
