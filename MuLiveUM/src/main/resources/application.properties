# DB related
spring.datasource.url=${JDBC_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

# MuLive related
mulive.gameserver.secret.header=${MULIVE_GAMESERVER_SECRET_HEADER}
mulive.gameserver.secret.header.val=${MULIVE_GAMESERVER_SECRET_HEADER_VAL}
mulive.pagination.size=10

# Email configurations
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=murlanlive@gmail.com
spring.mail.password=${MULIVE_UM_EMAIL_APP_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.starttls.enable=true

server.forward-headers-strategy=framework